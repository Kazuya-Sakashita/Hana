type: object
description: |
  アップロード完了通知。サーバはここで初めて `images` テーブルに行を作る。
  Storage 上のオブジェクトの存在を確認した上で Image レコードを作成する。
required: [storage_key, width, height, file_size]
properties:
  storage_key:
    type: string
    description: |
      `POST /uploads/presigned-url` で受け取った storage_key を返す。
      サーバ側で `uploads/{currentUserHash}/...` で始まることを検証し、
      他ユーザーの prefix を指定した場合は 403 を返す。
    example: 'uploads/8f7e6d5c4b3a4291/202605/a1b2c3d4-1234-4d8e-9abc-fedcba987654.jpg'
  width:
    type: integer
    minimum: 1
    maximum: 10000
    description: 画像の幅 (px)
    example: 1920
  height:
    type: integer
    minimum: 1
    maximum: 10000
    description: 画像の高さ (px)
    example: 1080
  file_size:
    type: integer
    minimum: 1
    maximum: 10485760
    description: ファイルサイズ (byte)。10 MiB を上限とする
    example: 524288
