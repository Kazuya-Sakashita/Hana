type: object
description: |
  アップロード完了通知。サーバはここで初めて `images` テーブルに行を作る。
  Storage 上の実体を検証し、寸法とファイルサイズを実体から算出してImageレコードを作成する。
required: [storage_key]
properties:
  storage_key:
    type: string
    description: |
      `POST /uploads/presigned-url` で受け取った storage_key を返す。
      サーバ側で `uploads/{currentUserHash}/...` で始まることを検証し、
      他ユーザーの prefix を指定した場合は 403 を返す。
    example: 'uploads/8f7e6d5c4b3a4291/202605/a1b2c3d4-1234-4d8e-9abc-fedcba987654.jpg'
  width:
    type: integer
    minimum: 1
    maximum: 10000
    deprecated: true
    description: 旧クライアント互換の申告値。サーバは使用せずStorage実体から算出する
    example: 1920
  height:
    type: integer
    minimum: 1
    maximum: 10000
    deprecated: true
    description: 旧クライアント互換の申告値。サーバは使用せずStorage実体から算出する
    example: 1080
  file_size:
    type: integer
    minimum: 1
    maximum: 10485760
    deprecated: true
    description: 旧クライアント互換の申告値。サーバは使用せずStorage実体から算出する
    example: 524288
