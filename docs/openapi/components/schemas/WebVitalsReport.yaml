type: object
description: |
  Web Vitals 計測 1 件の低cardinality報告 payload (ISSUE-152)。
  clientで固定dimensionへ変換し、web-vitalsのraw id / value / route / navigationTypeを送らない。
  event_idはstable sampling用であり、通常logやstatus-only evidenceへ出さない。
additionalProperties: false
required: [schema_version, event_id, operation, reason, route_group, status, duration_bucket]
properties:
  schema_version:
    type: string
    enum: [hana-web-vitals-report/v2]
  event_id:
    type: string
    format: uuid
    description: report単位のrandom UUID。actor識別には使わない。
  operation:
    type: string
    enum: [web_vital_cls, web_vital_fcp, web_vital_inp, web_vital_lcp, web_vital_ttfb]
  reason:
    type: string
    enum: [not_applicable]
  route_group:
    type: string
    enum: [public, auth, home, record, memory, settings, other_private]
  status:
    type: string
    enum: [good, needs_improvement, poor]
  duration_bucket:
    type: string
    enum:
      - not_applicable
      - under_100ms
      - from_100_to_500ms
      - from_501_to_1000ms
      - from_1001_to_2500ms
      - from_2501_to_4000ms
      - over_4000ms
