type: object
description: |
  子どもプロフィール更新リクエスト。
  全フィールド省略可。送られたフィールドのみ更新する (PATCH 的な PUT)。
properties:
  name:
    type: string
    minLength: 1
    maxLength: 50
    description: 表示名
    example: 'はると'
  birthdate:
    type: string
    format: date
    description: 生年月日 (YYYY-MM-DD)
    example: '2026-01-13'
  avatar_url:
    type: [string, 'null']
    format: uri
    description: アバター URL。ISSUE-008 まで null 固定で扱う
    example: null
