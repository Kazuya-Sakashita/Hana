type: object
additionalProperties: false
required: [authorization_url, expires_at]
properties:
  authorization_url:
    type: string
    format: uri
    description: Google OAuth再認証へ遷移するための短寿命URL。ログへ保存しない。
  expires_at:
    type: string
    format: date-time
    description: intentの有効期限（UTC、作成から5分）
