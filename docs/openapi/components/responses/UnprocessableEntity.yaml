description: |
  リクエストの構文は正しいが、ビジネスルール上受理できない。
  フィールド単位のバリデーションエラーは `errors[]` で返す。
content:
  application/problem+json:
    schema:
      $ref: '../schemas/ProblemDetails.yaml'
    examples:
      validation_error:
        summary: Field validation failure
        value:
          type: 'https://hana.app/problems/validation-error'
          title: 'Validation Error'
          status: 422
          detail: '入力内容に誤りがあります'
          reason: 'validation_error'
          instance: 'req_01HXYZABCDEFG'
          errors:
            - path: 'body.name'
              reason: 'required'
              message: '必須項目です'
            - path: 'body.birthdate'
              reason: 'invalid_format'
              message: 'YYYY-MM-DD 形式で入力してください'
