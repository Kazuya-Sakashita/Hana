description: |
  リソース状態の競合。重複登録、楽観ロック失敗、状態遷移違反など。
content:
  application/problem+json:
    schema:
      $ref: '../schemas/ProblemDetails.yaml'
    examples:
      email_already_registered:
        summary: Email already registered
        value:
          type: 'https://hana.app/problems/email-already-registered'
          title: 'Conflict'
          status: 409
          detail: 'このメールアドレスは既に登録済みです'
          reason: 'email_already_registered'
          instance: 'req_01HXYZABCDEFG'
      child_limit_reached:
        summary: Child limit reached (MVP は 1 ユーザー 1 子ども)
        value:
          type: 'https://hana.app/problems/child-limit-reached'
          title: 'Conflict'
          status: 409
          detail: '現在のプランでは子どもプロフィールは 1 件までです'
          reason: 'child_limit_reached'
          instance: 'req_01HXYZABCDEFG'
      memory_idempotency_conflict:
        summary: Idempotency key reused with different memory content
        value:
          type: 'https://hana.app/problems/memory-idempotency-conflict'
          title: 'Conflict'
          status: 409
          detail: '同じ保存操作の内容が一致しません'
          reason: 'memory_idempotency_conflict'
          instance: 'req_01HXYZABCDEFG'
      image_sanitization_pending:
        summary: Original image metadata sanitization is pending
        value:
          type: 'https://hana.app/problems/image-sanitization-pending'
          title: 'Conflict'
          status: 409
          detail: '原画像の安全確認を処理中です'
          reason: 'image_sanitization_pending'
          instance: 'req_01HXYZABCDEFG'
      image_already_linked:
        summary: Image is already linked to a memory
        value:
          type: 'https://hana.app/problems/image-already-linked'
          title: 'Conflict'
          status: 409
          detail: 'この画像は記録に保存されています'
          reason: 'image_already_linked'
          instance: 'req_01HXYZABCDEFG'
