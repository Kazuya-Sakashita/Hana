openapi: 3.1.0
info:
  title: Hana API
  version: 0.1.0
  summary: AI 育児記録アプリ Hana のバックエンド API
  description: |
    写真 1 枚から AI が子どもとの記憶を物語にする育児記録アプリ Hana の API。

    - 認証: Bearer JWT
    - エラー形式: RFC 9457 Problem Details (`application/problem+json`)
    - ページネーション: カーソル方式（`limit` + `cursor`）
    - 画像アクセス: Presigned URL（公開 URL を使わない）

    詳細は以下を参照:
    - `docs/api-driven-development/README.md`
    - `docs/api-driven-development/openapi-style-guide.md`
    - `docs/api-driven-development/error-format.md`
  contact:
    name: Hana Maintainers
    url: https://github.com/Kazuya-Sakashita/Hana
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://staging.hana.app/v1
    description: Staging（予定）
  - url: https://api.hana.app/v1
    description: Production（予定）
security:
  - bearerAuth: []
tags:
  - name: meta
    description: ヘルスチェック等の運用エンドポイント
  - name: children
    description: 子どもプロフィール
  - name: uploads
    description: 写真アップロード (presigned URL 方式)
  - name: memories
    description: 記録 (1 日 1 ページの育児ログ)
  - name: ai
    description: AI 文章生成 (Claude API)
  - name: metrics
    description: パフォーマンス計測 (Web Vitals RUM)
  - name: waitlist
    description: 公開前の待機リスト登録
paths:
  /health:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      description: API が稼働しているか確認する公開エンドポイント。認証不要。
      tags: [meta]
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    description: 'ok を返す'
                    enum: [ok]
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      operationId: getCurrentUser
      summary: 現在のユーザーを取得
      description: |
        Supabase Auth セッションから現在のユーザー (AppUser) を返す。
        profileはOAuth callbackで明示的に作成する。profileが無い場合や
        `access_blocked_at`が設定済みの場合、通常APIはユーザーを返さない。
      tags: [meta]
      responses:
        '200':
          description: 現在のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
              example:
                id: '8f7e6d5c-4b3a-4291-8765-0123456789ab'
                email: null
                display_name: null
                ai_consent_at: null
                created_at: '2026-05-14T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/ai-consent:
    post:
      operationId: setAiConsent
      summary: AI への画像送信に同意する
      description: |
        現在のユーザーの `profile.ai_consent_at` を **現在時刻にセット** する (idempotent)。
        既に同意済みでも 200 を返す (時刻は更新しない)。

        AI 同意なしで `POST /ai/generate` を叩くと 403 `ai_consent_required` が返るので、
        クライアントは同意ダイアログ → 本エンドポイント → 生成 の順で呼ぶ。
      tags: [meta]
      responses:
        '200':
          description: 同意後の AppUser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: revokeAiConsent
      summary: AI への画像送信の同意を撤回する
      description: |
        現在のユーザーの `profile.ai_consent_at` を `null` にする (idempotent)。
        既に未同意でも 200 を返す。

        撤回後の `POST /ai/generate` は 403 `ai_consent_required` を返す。
        AIを使わない記録の作成・編集・閲覧と既存記録には影響しない。
        本操作は過去のAI送信や既存記録を個別削除する手続きではない。
        撤回前に開始したAI生成は完了する場合がある。
      tags: [meta]
      responses:
        '200':
          description: 同意撤回後の AppUser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
              example:
                id: '8f7e6d5c-4b3a-4291-8765-0123456789ab'
                email: null
                display_name: null
                ai_consent_at: null
                created_at: '2026-05-14T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/account-deletion-intents:
    post:
      operationId: createAccountDeletionIntent
      summary: 退会用のGoogle再認証を開始する
      description: |
        現在のactive userに対して、5分間・一回限り有効な退会intentを作成し、
        Google OAuth再認証URLを返す。intentのraw tokenはHttpOnly cookieだけに保持し、
        DB、レスポンス、URL、ログへ出さない。

        OAuth callbackで再認証後のSupabase user idがintent作成者と一致した場合だけ、
        intentをverifiedにする。email一致やtoken refreshだけではverifiedにしない。
      tags: [meta]
      responses:
        '201':
          description: 再認証intentを作成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionIntentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/account-deletion:
    post:
      operationId: requestAccountDeletion
      summary: 退会を受け付け、通常アクセスを即時停止する
      description: |
        同一userでverifiedとなった未使用・期限内の退会intentと、
        完全一致の確認文言を検証して退会を受け付ける。

        DB transactionでprofileのaccess block、退会受付、purge期限、
        子ども・記録・画像の論理削除、AI同意解除、Auth無効化jobを同時に確定する。
        commit後はlease・backoff・上限付きworkerがSupabase Auth無効化を再試行する。
        provider障害や既に削除済みの応答があってもDB access blockを戻さない。

        通常画面・APIからのアクセスは受付直後に停止する。
        受付前に発行済みの画像signed URLは最大30分で失効する。
        同じ利用者からの重複要求は最初のrequested_at / purge_afterを返す。
      tags: [meta]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 退会受付の再送を識別するUUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: 退会受付済み。重複要求も同じ状態を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/account-deletion/status:
    get:
      operationId: getAccountDeletionStatus
      summary: 退会受付結果を確認する
      description: |
        退会再認証時に発行したHttpOnly receipt cookieを使い、応答喪失後の受付結果を確認する。
        raw receiptはDB、レスポンス、URL、ログへ出さない。一致する受付がない場合は404を返す。
      tags: [meta]
      security: []
      responses:
        '200':
          description: 退会受付済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /children:
    get:
      operationId: listChildren
      summary: 子どもプロフィール一覧
      description: |
        認証ユーザーが登録した子どもプロフィールを返す。
        MVP では最大 1 件 (1 ユーザー 1 子ども制限)。
      tags: [children]
      responses:
        '200':
          description: 子どもプロフィール一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildListResponse'
              example:
                data:
                  - id: '4a2c89b6-1234-4d8e-9abc-fedcba987654'
                    name: 'はると'
                    birthdate: '2026-01-13'
                    avatar_url: null
                    created_at: '2026-05-23T01:30:00Z'
                    updated_at: '2026-05-23T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createChild
      summary: 子どもプロフィール作成
      description: |
        新しい子どもプロフィールを作成する。
        MVP では 1 ユーザー 1 件までで、2 件目は 409 `child_limit_reached` を返す。
      tags: [children]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreateRequest'
            example:
              name: 'はると'
              birthdate: '2026-01-13'
              avatar_url: null
      responses:
        '201':
          description: 作成された子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        description: 子ども ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getChild
      summary: 子どもプロフィール取得
      description: |
        指定した子どもプロフィールを返す。
        他ユーザーの子どもには 403 を返す (404 で隠す案もあるが、Hana では明示的に 403)。
      tags: [children]
      responses:
        '200':
          description: 子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateChild
      summary: 子どもプロフィール更新
      description: |
        指定した子どもプロフィールを更新する。
        全フィールド省略可。送られたフィールドのみ更新 (PATCH 的な PUT)。
        認証ユーザー本人が所有するプロフィールだけを更新できる。
        `name` は前後の空白を除いた 1〜50 文字、`birthdate` は実在する未来でない日付とする。
      tags: [children]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdateRequest'
            example:
              name: 'はると'
      responses:
        '200':
          description: 更新後の子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/presigned-url:
    post:
      operationId: createPresignedUpload
      summary: 写真アップロード用 signed URL を発行
      description: |
        Supabase Storage に画像を直接 PUT するための **一回限りの signed URL** を発行する。
        signed URL の発行前に、サーバはアップロード予約を DB に記録する。アップロード完了後に
        `POST /uploads/confirm` を呼ぶことで Image レコードを作成し、予約を完了する。
        保持期間を過ぎても確定されない予約は、別の cleanup job の対象になる。

        PUT の成否が不明な場合や PUT が失敗した場合は、このエンドポイントで新しい
        signed URL と storage_key を発行し、同じ再エンコード済み画像を新しい URL へ送る。

        クライアントは PUT 前に **Canvas API 等で EXIF を削除** することが期待される (ADR-0009)。
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
            example:
              file_name: 'IMG_1234.jpg'
              content_type: 'image/jpeg'
      responses:
        '200':
          description: signed URL と storage_key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/confirm:
    post:
      operationId: confirmUpload
      summary: アップロード完了を通知して Image レコードを作成
      description: |
        クライアントが presigned URL に PUT したあとに呼ぶ。
        サーバは `storage_key` のプレフィクスが現在のユーザーのものであることを検証し、
        Supabase Storage 上の実体を上限付きstreamで取得する。magic bytes、MIME、
        静止画であること、完全decode、向き補正後の寸法、10 MiB・25 MP上限を検証し、
        実体から算出した値で `images` テーブルに行を作成する。

        `width`、`height`、`file_size`は旧クライアントとの互換性のため受理するが、
        OpenAPIどおりの形式だけを受理し、Imageの確定値には使用しない。欠落は `not_found`、破損は
        `invalid_image_content`、MIME不一致は `content_type_mismatch`、上限超過は
        `file_too_large`または`image_dimensions_too_large`、動画・animated画像は
        `animated_image_not_supported`で拒否する。Storageの一時障害は
        `storage_unavailable`で返す。

        HEIC元ファイルはクライアントでJPEGへ再エンコードする。HEICの直接uploadは
        実行環境のdecoderを固定できるまで発行せず、既存keyの確定要求は
        `unsupported_media_type`で拒否する。

        同じユーザーが同じ `storage_key` を再送した場合は、既存の Image を返す冪等操作とする。
        初回作成時は 201、既に確定済みの場合は 200 を返す。
        confirm と未確定アップロード cleanup は storage_key 単位の同じロックで直列化する。
        期限切れ予約を cleanup が先に確保した場合、削除済みobjectを指す Image 行は作成しない。
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadConfirmRequest'
            example:
              storage_key: 'uploads/8f7e6d5c4b3a4291/202605/a1b2c3d4-1234-4d8e-9abc-fedcba987654.jpg'
      responses:
        '200':
          description: 既に確定済みの Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '201':
          description: 作成された Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/{imageId}/url:
    parameters:
      - name: imageId
        in: path
        required: true
        description: 画像 ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getImageDownloadUrl
      summary: 画像ダウンロード用の signed URL を発行
      description: |
        指定した画像の Supabase Storage signed URL を返す (TTL 30 分)。
        画像は現在のユーザーが所有していること。
        URL はログに残さない (一時的とはいえ認証情報を含む)。

        `size` パラメータで Supabase Storage の image transformation を指定可能:
        - `thumbnail`: width=320 / quality=70 (一覧表示用)
        - `preview`: width=1024 / quality=80 (詳細表示用)
        - `original`: 変換なし (default)

        サーバー側のメタデータ除去が完了していない既存画像について、
        `original` は 409 `image_sanitization_pending` とし signed URL を発行しない。
        再エンコード済みの `thumbnail` / `preview` は引き続き取得できる。

        レスポンスには `Cache-Control: private, max-age=300` を設定 (ADR-0012)。
        クライアントは presigned URL の TTL 内であれば再取得を避けて良い。
      tags: [uploads]
      parameters:
        - name: size
          in: query
          required: false
          description: 画像サイズ。 省略時は `original`
          schema:
            type: string
            enum: [thumbnail, preview, original]
            default: original
      responses:
        '200':
          description: signed URL
          headers:
            Cache-Control:
              description: private, max-age=300
              schema:
                type: string
                example: 'private, max-age=300'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memories:
    get:
      operationId: listMemories
      summary: 記録一覧
      description: |
        現在のユーザーが所有する記録をカーソル方式で返す。
        並び順: `recorded_at` 降順 → `id` 降順 (タイブレーカー)。
        `recorded_from` と `recorded_before` は必ず同時に指定し、
        `recorded_from <= recorded_at < recorded_before` の範囲に絞り込む。
        画像 URL は含めない (`GET /uploads/{imageId}/url` で取得)。
      tags: [memories]
      parameters:
        - name: limit
          in: query
          description: 1 ページあたりの件数 (default 20, max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: 前回レスポンスの `page.next_cursor`
          required: false
          schema:
            type: string
        - name: recorded_from
          in: query
          description: 記録日の範囲開始日（含む）。`recorded_before` と同時に指定する
          required: false
          schema:
            type: string
            format: date
        - name: recorded_before
          in: query
          description: 記録日の範囲終了日（含まない）。`recorded_from` と同時に指定する
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 記録一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createMemory
      summary: 記録作成
      description: |
        新しい記録を作成し、指定の画像群を紐付ける。
        - `child_id` は現在のユーザーが所有していること
        - `image_ids` は **各画像が現在のユーザーが所有** かつ **未紐付け** であること
        - 失敗時はトランザクションでロールバック
        - `Idempotency-Key` はユーザー単位で扱い、同じキー・同じ内容の再送は既存の記録を返す
        - 同じキーを異なる内容で再利用した場合は 409 `memory_idempotency_conflict`
      tags: [memories]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            記録作成操作を一意にするUUID。同じタブの保存再試行では同じ値を使う。
            APIレスポンスやログには出力しない。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateRequest'
      responses:
        '200':
          description: 同じ冪等キー・同じ内容で既に作成済みの記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '201':
          description: 作成された記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        description: 記録 ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getMemory
      summary: 記録取得
      description: |
        現在のユーザーが所有する未削除の記録だけを返す。
        不存在、削除済み、他ユーザー所有はいずれも同じ 404 `not_found` を返し、
        記録の存在を判別できないようにする。
      tags: [memories]
      responses:
        '200':
          description: 記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateMemory
      summary: 記録更新
      description: |
        現在のユーザーが所有する未削除の記録について、title / body / weather /
        is_favorite を部分更新する。送らないフィールドは変更されない。
        `expected_updated_at` が現在の更新世代と一致する場合だけ更新し、
        古い世代の場合は 409 `memory_update_conflict` を返す。
        不存在、削除済み、他ユーザー所有はいずれも同じ 404 `not_found` を返す。
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdateRequest'
      responses:
        '200':
          description: 更新後の記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteMemory
      summary: 記録削除 (論理削除)
      description: |
        現在のユーザーが所有する未削除の記録を論理削除する (`deleted_at` セット)。
        不存在、削除済み、他ユーザー所有はいずれも同じ 404 `not_found` を返す。
        通常の取得・一覧からは表示されなくなる。
        紐付く画像は **そのまま残る** (画像の Storage 削除は退会フロー / cleanup ジョブで)。
        復元は、レビュー済みの UI / API / サポートフローが揃うまで提供しない。
      tags: [memories]
      responses:
        '204':
          description: 削除成功 (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metrics/vitals:
    post:
      operationId: reportWebVitals
      summary: Web Vitals 計測の報告 (RUM、 ISSUE-024)
      description: |
        ブラウザの `web-vitals` ライブラリから `navigator.sendBeacon` で送られる
        Web Vitals メトリクス (CLS / FCP / INP / LCP / TTFB) を受け、 構造化ログに記録する。
        DB 保存はしない (Vercel Logs で十分)。
        サインアウト状態でも送れる (匿名で記録)。
        PII を含めない (allowlist: name / value / id / navigationType / route + userIdHash)。
      tags: [metrics]
      security:
        - bearerAuth: []
        - {} # 匿名も受け入れる
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebVitalsReport'
      responses:
        '204':
          description: 受信成功 (body なし)
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /metrics/events:
    post:
      operationId: reportProductEvent
      summary: 記録体験の仮名化プロダクトイベントを報告する
      description: |
        認証済みユーザーの記録フローについて、許可リスト化したイベントだけを受け付ける。
        actor は session の user_id からサーバー側で HMAC-SHA256 に変換した仮名識別子として保存し、
        クライアントからユーザー識別子を受け取らない。

        request body は event_name / event_id / flow_id / elapsed_bucket に限定する。
        記録本文、画像情報、氏名、生年月日、メール、URL、storage_key、自由記述は受け付けない。
        同じ event_id の同一内容再送と、同一ユーザー・flow_id・event_name の再操作は二重作成せず、
        同じ 204 を返す。イベントは90日で削除し、1ユーザーあたり毎分60件に制限する。
      tags: [metrics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventReport'
      responses:
        '204':
          description: 受信成功または冪等な再送 (body なし)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /waitlist:
    post:
      operationId: createWaitlistSignup
      summary: 公開前待機リストへ登録する
      description: |
        公開前検証フェーズの LP から、待機リスト登録・β版案内・任意のインタビューや
        フィードバック協力のお願い・正式リリースのお知らせに使うメールアドレスを受け取る公開エンドポイント。

        取得目的は上記に限定し、メールアドレスはレスポンスや構造化ログには含めない。
        source と privacy_policy_version は既知値だけ受け付ける。
        同じメールアドレスの再登録は重複作成せず、同じ 202 を返す。
      tags: [waitlist]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistSignupCreateRequest'
      responses:
        '202':
          description: 待機リスト登録を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSignupResponse'
              example:
                status: accepted
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ai/generate:
    post:
      operationId: generateAiText
      summary: AI による育児記録の文章生成
      description: |
        指定の画像群と子どもの月齢・天気・親のひとことから、タイトル + 本文 + タグを生成する。
        画像とプロンプトは Anthropic Claude API に送信される。

        **AI 同意が必要**: 初回呼び出しの前にクライアントが
        `profile.ai_consent_at` をセット (本Issueでは UI ダイアログで同意取得)。
        未同意で叩くと 403 `ai_consent_required` を返す。

        AI vendor 呼び出しに到達した生成リクエストは、成功・失敗を問わず
        **月間 20 回まで** (Free tier)。超過時は 429 `ai_quota_exceeded`。

        生成結果が出力ポリシーに違反した場合は内部で1回だけ再生成する。
        再生成時は、拒否本文やカテゴリを含めず、安全基準を再確認する固定指示だけを追加する。
        再生成後も違反する場合、生成本文や違反カテゴリを返さず
        422 `ai_output_rejected` を返す。
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
      responses:
        '200':
          description: 生成結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AiGenerateUnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
