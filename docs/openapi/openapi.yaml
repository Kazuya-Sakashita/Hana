openapi: 3.1.0
info:
  title: Hana API
  version: 0.1.0
  summary: AI 育児記録アプリ Hana のバックエンド API
  description: |
    写真 1 枚から AI が子どもとの記憶を物語にする育児記録アプリ Hana の API。

    - 認証: Bearer JWT
    - エラー形式: RFC 9457 Problem Details (`application/problem+json`)
    - ページネーション: カーソル方式（`limit` + `cursor`）
    - 画像アクセス: Presigned URL（公開 URL を使わない）

    詳細は以下を参照:
    - `docs/api-driven-development/README.md`
    - `docs/api-driven-development/openapi-style-guide.md`
    - `docs/api-driven-development/error-format.md`
  contact:
    name: Hana Maintainers
    url: https://github.com/Kazuya-Sakashita/Hana
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://staging.hana.app/v1
    description: Staging（予定）
  - url: https://api.hana.app/v1
    description: Production（予定）
security:
  - bearerAuth: []
tags:
  - name: meta
    description: ヘルスチェック等の運用エンドポイント
  - name: children
    description: 子どもプロフィール
  - name: uploads
    description: 写真アップロード (presigned URL 方式)
  - name: memories
    description: 記録 (1 日 1 ページの育児ログ)
  - name: ai
    description: AI 文章生成 (Claude API)
  - name: metrics
    description: パフォーマンス計測 (Web Vitals RUM)
  - name: waitlist
    description: 公開前の待機リスト登録
paths:
  /health:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      description: API が稼働しているか確認する公開エンドポイント。認証不要。
      tags: [meta]
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    description: 'ok を返す'
                    enum: [ok]
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      operationId: getCurrentUser
      summary: 現在のユーザーを取得
      description: |
        Supabase Auth セッションから現在のユーザー (AppUser) を返す。
        profile レコードが無い場合はサーバ側で lazy に作成する。
      tags: [meta]
      responses:
        '200':
          description: 現在のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
              example:
                id: '8f7e6d5c-4b3a-4291-8765-0123456789ab'
                email: 'parent@example.com'
                display_name: null
                ai_consent_at: null
                created_at: '2026-05-14T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/ai-consent:
    post:
      operationId: setAiConsent
      summary: AI への画像送信に同意する
      description: |
        現在のユーザーの `profile.ai_consent_at` を **現在時刻にセット** する (idempotent)。
        既に同意済みでも 200 を返す (時刻は更新しない)。

        AI 同意なしで `POST /ai/generate` を叩くと 403 `ai_consent_required` が返るので、
        クライアントは同意ダイアログ → 本エンドポイント → 生成 の順で呼ぶ。
      tags: [meta]
      responses:
        '200':
          description: 同意後の AppUser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /children:
    get:
      operationId: listChildren
      summary: 子どもプロフィール一覧
      description: |
        認証ユーザーが登録した子どもプロフィールを返す。
        MVP では最大 1 件 (1 ユーザー 1 子ども制限)。
      tags: [children]
      responses:
        '200':
          description: 子どもプロフィール一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildListResponse'
              example:
                data:
                  - id: '4a2c89b6-1234-4d8e-9abc-fedcba987654'
                    name: 'はると'
                    birthdate: '2026-01-13'
                    avatar_url: null
                    created_at: '2026-05-23T01:30:00Z'
                    updated_at: '2026-05-23T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createChild
      summary: 子どもプロフィール作成
      description: |
        新しい子どもプロフィールを作成する。
        MVP では 1 ユーザー 1 件までで、2 件目は 409 `child_limit_reached` を返す。
      tags: [children]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreateRequest'
            example:
              name: 'はると'
              birthdate: '2026-01-13'
              avatar_url: null
      responses:
        '201':
          description: 作成された子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        description: 子ども ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getChild
      summary: 子どもプロフィール取得
      description: |
        指定した子どもプロフィールを返す。
        他ユーザーの子どもには 403 を返す (404 で隠す案もあるが、Hana では明示的に 403)。
      tags: [children]
      responses:
        '200':
          description: 子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateChild
      summary: 子どもプロフィール更新
      description: |
        指定した子どもプロフィールを更新する。
        全フィールド省略可。送られたフィールドのみ更新 (PATCH 的な PUT)。
      tags: [children]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdateRequest'
            example:
              name: 'はると'
      responses:
        '200':
          description: 更新後の子どもプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/presigned-url:
    post:
      operationId: createPresignedUpload
      summary: 写真アップロード用 signed URL を発行
      description: |
        Supabase Storage に画像を直接 PUT するための **一回限りの signed URL** を発行する。
        このエンドポイントは DB に書き込みを行わない。アップロード完了後に
        `POST /uploads/confirm` を呼ぶことで Image レコードが作成される。

        クライアントは PUT 前に **Canvas API 等で EXIF を削除** することが期待される (ADR-0009)。
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
            example:
              file_name: 'IMG_1234.jpg'
              content_type: 'image/jpeg'
      responses:
        '200':
          description: signed URL と storage_key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/confirm:
    post:
      operationId: confirmUpload
      summary: アップロード完了を通知して Image レコードを作成
      description: |
        クライアントが presigned URL に PUT したあとに呼ぶ。
        サーバは `storage_key` のプレフィクスが現在のユーザーのものであることを検証し、
        Supabase Storage 上でオブジェクトの存在を確認した上で `images` テーブルに行を作成する。
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadConfirmRequest'
            example:
              storage_key: 'uploads/8f7e6d5c4b3a4291/202605/a1b2c3d4-1234-4d8e-9abc-fedcba987654.jpg'
              width: 1920
              height: 1080
              file_size: 524288
      responses:
        '201':
          description: 作成された Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/{imageId}/url:
    parameters:
      - name: imageId
        in: path
        required: true
        description: 画像 ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getImageDownloadUrl
      summary: 画像ダウンロード用の signed URL を発行
      description: |
        指定した画像の Supabase Storage signed URL を返す (TTL 30 分)。
        画像は現在のユーザーが所有していること。
        URL はログに残さない (一時的とはいえ認証情報を含む)。

        `size` パラメータで Supabase Storage の image transformation を指定可能:
        - `thumbnail`: width=320 / quality=70 (一覧表示用)
        - `preview`: width=1024 / quality=80 (詳細表示用)
        - `original`: 変換なし (default)

        レスポンスには `Cache-Control: private, max-age=300` を設定 (ADR-0012)。
        クライアントは presigned URL の TTL 内であれば再取得を避けて良い。
      tags: [uploads]
      parameters:
        - name: size
          in: query
          required: false
          description: 画像サイズ。 省略時は `original`
          schema:
            type: string
            enum: [thumbnail, preview, original]
            default: original
      responses:
        '200':
          description: signed URL
          headers:
            Cache-Control:
              description: private, max-age=300
              schema:
                type: string
                example: 'private, max-age=300'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memories:
    get:
      operationId: listMemories
      summary: 記録一覧
      description: |
        現在のユーザーが所有する記録をカーソル方式で返す。
        並び順: `recorded_at` 降順 → `id` 降順 (タイブレーカー)。
        画像 URL は含めない (`GET /uploads/{imageId}/url` で取得)。
      tags: [memories]
      parameters:
        - name: limit
          in: query
          description: 1 ページあたりの件数 (default 20, max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: 前回レスポンスの `page.next_cursor`
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 記録一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createMemory
      summary: 記録作成
      description: |
        新しい記録を作成し、指定の画像群を紐付ける。
        - `child_id` は現在のユーザーが所有していること
        - `image_ids` は **各画像が現在のユーザーが所有** かつ **未紐付け** であること
        - 失敗時はトランザクションでロールバック
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateRequest'
      responses:
        '201':
          description: 作成された記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        description: 記録 ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      operationId: getMemory
      summary: 記録取得
      description: 指定した記録を返す。他人の記録は 403、存在しない場合は 404。
      tags: [memories]
      responses:
        '200':
          description: 記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateMemory
      summary: 記録更新
      description: title / body / weather / is_favorite を部分更新する。送らないフィールドは変更されない。
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdateRequest'
      responses:
        '200':
          description: 更新後の記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteMemory
      summary: 記録削除 (論理削除)
      description: |
        記録を論理削除する (`deleted_at` セット)。
        通常の取得・一覧からは表示されなくなる。
        紐付く画像は **そのまま残る** (画像の Storage 削除は退会フロー / cleanup ジョブで)。
        復元は、レビュー済みの UI / API / サポートフローが揃うまで提供しない。
      tags: [memories]
      responses:
        '204':
          description: 削除成功 (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metrics/vitals:
    post:
      operationId: reportWebVitals
      summary: Web Vitals 計測の報告 (RUM、 ISSUE-024)
      description: |
        ブラウザの `web-vitals` ライブラリから `navigator.sendBeacon` で送られる
        Web Vitals メトリクス (CLS / FCP / INP / LCP / TTFB) を受け、 構造化ログに記録する。
        DB 保存はしない (Vercel Logs で十分)。
        サインアウト状態でも送れる (匿名で記録)。
        PII を含めない (allowlist: name / value / id / navigationType / route + userIdHash)。
      tags: [metrics]
      security:
        - bearerAuth: []
        - {} # 匿名も受け入れる
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebVitalsReport'
      responses:
        '204':
          description: 受信成功 (body なし)
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /waitlist:
    post:
      operationId: createWaitlistSignup
      summary: 公開前待機リストへ登録する
      description: |
        公開前検証フェーズの LP から、待機リスト登録・β版案内・任意のインタビューや
        フィードバック協力のお願い・正式リリースのお知らせに使うメールアドレスを受け取る公開エンドポイント。

        取得目的は上記に限定し、メールアドレスはレスポンスや構造化ログには含めない。
        source と privacy_policy_version は既知値だけ受け付ける。
        同じメールアドレスの再登録は重複作成せず、同じ 202 を返す。
      tags: [waitlist]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistSignupCreateRequest'
            example:
              email: 'parent@example.com'
              consent: true
              source: 'current-lp'
              privacy_policy_version: 'prelaunch-2026-07-25'
      responses:
        '202':
          description: 待機リスト登録を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSignupResponse'
              example:
                status: accepted
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ai/generate:
    post:
      operationId: generateAiText
      summary: AI による育児記録の文章生成
      description: |
        指定の画像群と子どもの月齢・天気・親のひとことから、タイトル + 本文 + タグを生成する。
        画像とプロンプトは Anthropic Claude API に送信される。

        **AI 同意が必要**: 初回呼び出しの前にクライアントが
        `profile.ai_consent_at` をセット (本Issueでは UI ダイアログで同意取得)。
        未同意で叩くと 403 `ai_consent_required` を返す。

        **月間 20 回まで** (Free tier)。超過時は 429 `ai_quota_exceeded`。
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
      responses:
        '200':
          description: 生成結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      $ref: './components/securitySchemes.yaml#/bearerAuth'
  schemas:
    ProblemDetails:
      $ref: './components/schemas/ProblemDetails.yaml'
    ProblemDetailFieldError:
      $ref: './components/schemas/ProblemDetailFieldError.yaml'
    AppUser:
      $ref: './components/schemas/AppUser.yaml'
    Child:
      $ref: './components/schemas/Child.yaml'
    ChildListResponse:
      $ref: './components/schemas/ChildListResponse.yaml'
    ChildCreateRequest:
      $ref: './components/schemas/ChildCreateRequest.yaml'
    ChildUpdateRequest:
      $ref: './components/schemas/ChildUpdateRequest.yaml'
    Image:
      $ref: './components/schemas/Image.yaml'
    PresignedUploadRequest:
      $ref: './components/schemas/PresignedUploadRequest.yaml'
    PresignedUploadResponse:
      $ref: './components/schemas/PresignedUploadResponse.yaml'
    UploadConfirmRequest:
      $ref: './components/schemas/UploadConfirmRequest.yaml'
    ImageUrlResponse:
      $ref: './components/schemas/ImageUrlResponse.yaml'
    Memory:
      $ref: './components/schemas/Memory.yaml'
    MemoryListResponse:
      $ref: './components/schemas/MemoryListResponse.yaml'
    WebVitalsReport:
      $ref: './components/schemas/WebVitalsReport.yaml'
    WaitlistSignupCreateRequest:
      $ref: './components/schemas/WaitlistSignupCreateRequest.yaml'
    WaitlistSignupResponse:
      $ref: './components/schemas/WaitlistSignupResponse.yaml'
    MemoryCreateRequest:
      $ref: './components/schemas/MemoryCreateRequest.yaml'
    MemoryUpdateRequest:
      $ref: './components/schemas/MemoryUpdateRequest.yaml'
    AiGenerateRequest:
      $ref: './components/schemas/AiGenerateRequest.yaml'
    AiGenerateResponse:
      $ref: './components/schemas/AiGenerateResponse.yaml'
  parameters:
    Limit:
      $ref: './components/parameters/Limit.yaml'
    Cursor:
      $ref: './components/parameters/Cursor.yaml'
    RequestId:
      $ref: './components/parameters/RequestId.yaml'
  responses:
    BadRequest:
      $ref: './components/responses/BadRequest.yaml'
    Unauthorized:
      $ref: './components/responses/Unauthorized.yaml'
    Forbidden:
      $ref: './components/responses/Forbidden.yaml'
    NotFound:
      $ref: './components/responses/NotFound.yaml'
    Conflict:
      $ref: './components/responses/Conflict.yaml'
    UnprocessableEntity:
      $ref: './components/responses/UnprocessableEntity.yaml'
    TooManyRequests:
      $ref: './components/responses/TooManyRequests.yaml'
    InternalServerError:
      $ref: './components/responses/InternalServerError.yaml'
