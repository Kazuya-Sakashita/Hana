<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Hana synthetic daily still life</title>
  <desc id="desc">A synthetic daily still-life visual of folded cloth, tiny socks, and a wooden toy on textured warm paper.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="73" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#3a261e" flood-opacity=".09" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3a261e" flood-opacity=".045" />
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9" />
      <stop offset=".54" stop-color="#f7efe4" />
      <stop offset="1" stop-color="#fbf7f2" />
    </linearGradient>
    <linearGradient id="cloth" x1=".14" y1=".06" x2=".9" y2=".96">
      <stop offset="0" stop-color="#d5dbc8" />
      <stop offset=".45" stop-color="#b7bea7" />
      <stop offset="1" stop-color="#919a83" />
    </linearGradient>
    <linearGradient id="sock" x1=".12" y1=".08" x2=".88" y2="1">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset=".58" stop-color="#f0e5d7" />
      <stop offset="1" stop-color="#d8cabc" />
    </linearGradient>
    <linearGradient id="wood" x1=".16" y1=".1" x2=".9" y2="1">
      <stop offset="0" stop-color="#e4c28b" />
      <stop offset=".5" stop-color="#cda066" />
      <stop offset="1" stop-color="#9e7042" />
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="#fbf7f2" />
  <rect width="720" height="520" fill="#fbf7f2" filter="url(#grain)" opacity=".9" />
  <path d="M-18 134c84 24 166 10 256-22 100-36 196-44 298 0 72 30 130 38 202 16v402H-18Z" fill="#f5ede3" opacity=".72" filter="url(#grain)" />
  <g transform="rotate(-1.8 360 260)">
    <path filter="url(#softShadow)" d="M91 102c86-18 338-42 534-4 28 6 46 31 40 59l-50 241c-6 27-31 44-58 39-166-29-326-24-476 0-31 5-58-19-56-50l18-233c2-25 22-46 48-52Z" fill="url(#paper)" stroke="#ede4d8" stroke-width="2" />
  </g>
  <g transform="translate(138 116) rotate(-6)">
    <path filter="url(#softShadow)" d="M20 34c68-26 154-28 238 0 18 6 28 26 22 44l-46 144c-6 18-25 30-44 27-54-8-104-8-154 0-20 3-39-11-42-32L-19 83c-3-21 11-42 39-49Z" fill="url(#cloth)" />
  </g>
  <g transform="translate(382 190) rotate(7)">
    <path filter="url(#softShadow)" d="M20 62c11-52 70-54 88-10l15 54c7 24-9 48-34 50l-38 3c-26 2-46-21-40-46Z" fill="url(#sock)" stroke="#ede4d8" stroke-width="2" />
    <path filter="url(#softShadow)" d="M118 50c16-48 76-46 88 2l12 53c5 24-12 46-36 47l-36 1c-28 1-46-27-36-53Z" fill="url(#sock)" stroke="#ede4d8" stroke-width="2" />
    <path d="M42 61c16 7 38 8 58 0M140 56c18 7 42 6 60-2" stroke="#e5d9cc" stroke-width=".9" stroke-linecap="round" opacity=".11" />
    <path d="M50 88c14 8 34 8 51 2M146 85c14 7 32 7 48 1" stroke="#fffaf3" stroke-width="1" stroke-linecap="round" opacity=".12" />
  </g>
  <g transform="translate(222 336) rotate(-4)">
    <g filter="url(#softShadow)">
      <ellipse cx="47" cy="58" rx="25" ry="27" fill="#8d6139" opacity=".28" />
      <ellipse cx="153" cy="58" rx="25" ry="27" fill="#8d6139" opacity=".24" />
      <circle cx="44" cy="50" r="25" fill="url(#wood)" />
      <circle cx="154" cy="50" r="25" fill="url(#wood)" />
      <path d="M51 49c14-50 57-78 106-43 38 27 58 53 58 82H18c2-18 13-30 33-39Z" fill="url(#wood)" stroke="#9e7042" stroke-width="3" />
      <circle cx="112" cy="33" r="24" fill="#fbf7f2" stroke="#a97944" stroke-width="6" />
    </g>
    <path d="M76 66c46 7 82 5 122-2" stroke="#e7c994" stroke-width="4" stroke-linecap="round" opacity=".5" />
  </g>
  <path d="M542 112c22 33 17 70-2 95-20-27-17-64 2-95Z" fill="#d8a5ab" opacity=".48" />
  <path d="M548 158c-31 4-58 24-70 53 33 4 60-15 70-53Z" fill="#c57a83" opacity=".34" />
  <line x1="541" y1="200" x2="522" y2="270" stroke="#8c5a5e" stroke-width="3" stroke-linecap="round" opacity=".46" />
</svg>
