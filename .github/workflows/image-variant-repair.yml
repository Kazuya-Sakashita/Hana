name: Image variant repair

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: image-variant-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected repair endpoint
        env:
          HANA_APP_URL: ${{ secrets.HANA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$HANA_APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HANA_APP_URL/internal/image-variant-repairs"
