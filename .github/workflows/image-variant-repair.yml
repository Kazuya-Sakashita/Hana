name: Image variant repair

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Select invoke to call the protected endpoint once
        required: true
        type: choice
        default: hold
        options:
          - hold
          - invoke

concurrency:
  group: image-variant-repair
  cancel-in-progress: false

jobs:
  hold:
    if: >-
      (github.event_name == 'schedule' && vars.HANA_MAINTENANCE_SCHEDULES_ENABLED != 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'invoke')
    runs-on: ubuntu-latest
    steps:
      - name: Report held maintenance schedule
        run: echo "Maintenance schedule is held; no endpoint was invoked." >> "$GITHUB_STEP_SUMMARY"

  repair:
    if: >-
      (github.event_name == 'schedule' && vars.HANA_MAINTENANCE_SCHEDULES_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'invoke')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected repair endpoint
        env:
          HANA_APP_URL: ${{ secrets.HANA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$HANA_APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HANA_APP_URL/internal/image-variant-repairs"
