name: unconfirmed-upload-cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Select invoke to call the protected endpoint once
        required: true
        type: choice
        default: hold
        options:
          - hold
          - invoke

concurrency:
  group: unconfirmed-upload-cleanup
  cancel-in-progress: false

jobs:
  hold:
    if: >-
      (github.event_name == 'schedule' && vars.HANA_MAINTENANCE_SCHEDULES_ENABLED != 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'invoke')
    runs-on: ubuntu-latest
    steps:
      - name: Report held maintenance schedule
        run: echo "Maintenance schedule is held; no endpoint was invoked." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      (github.event_name == 'schedule' && vars.HANA_MAINTENANCE_SCHEDULES_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'invoke')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run synthetic cleanup contract smoke
        run: pnpm vitest run tests/unit/features/uploads/unconfirmed-upload-cleanup.test.ts tests/unit/app/unconfirmed-upload-cleanup-cron.test.ts

      - name: Invoke protected cleanup endpoint
        env:
          HANA_APP_URL: ${{ secrets.HANA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$HANA_APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$HANA_APP_URL/internal/unconfirmed-upload-cleanups"
