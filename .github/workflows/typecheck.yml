name: pr-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: hana_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hana_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hana_ci
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      AI_MODEL: claude-haiku-4-5
      HANA_SYNTHETIC_E2E: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Supabase roles in local PostgreSQL
        run: pnpm qa:issue123:db-bootstrap

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Verify image access concurrency boundary
        run: ISSUE_123_DATABASE_QA=1 pnpm qa:issue123:image-boundary-db

      - name: Run PR gate
        run: pnpm pr:gate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build authenticated browser fixture target
        run: pnpm e2e:build

      - name: Run authenticated golden path
        run: pnpm e2e

      - name: Upload synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-140-synthetic-browser-failure
          path: |
            test-results/issue-140/**/test-failed-*.png
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
