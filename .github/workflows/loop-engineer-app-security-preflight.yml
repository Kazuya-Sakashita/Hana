name: loop-engineer-app-security-preflight

run-name: loop-engineer-app-security-preflight-${{ github.run_id }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: loop-engineer-app-security-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: hana-merge-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted-control
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
          package_json_file: trusted-control/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trusted-control/pnpm-lock.yaml
      - run: pnpm --dir trusted-control install --frozen-lockfile
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.LOOP_ENGINEER_APP_ID }}
          private-key: ${{ secrets.LOOP_ENGINEER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-checks: write
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
      - name: Publish status-only App security preflight
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_ID: ${{ vars.LOOP_ENGINEER_APP_ID }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: pnpm --dir trusted-control exec tsx scripts/loop-engineer/github-app-security-preflight.ts
