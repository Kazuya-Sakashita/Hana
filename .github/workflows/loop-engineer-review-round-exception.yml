name: loop-engineer-review-round-exception

run-name: loop-engineer-review-round-exception-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      exception_input:
        description: Status-only review-round exception request
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: loop-engineer-review-round-exception-controller
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue_id: ${{ steps.request.outputs.issue_id }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      max_round: ${{ steps.request.outputs.max_round }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - id: request
        name: Authenticate and bind the exception request to the live PR
        env:
          EXCEPTION_INPUT: ${{ inputs.exception_input }}
          GH_TOKEN: ${{ github.token }}
          LOOP_ENGINEER_DISPATCHER_LOGIN: ${{ vars.LOOP_ENGINEER_DISPATCHER_LOGIN }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          set -euo pipefail
          if [[ -z "$LOOP_ENGINEER_DISPATCHER_LOGIN" || "$GITHUB_ACTOR" != "$LOOP_ENGINEER_DISPATCHER_LOGIN" || "$SENDER_TYPE" != "User" ]]; then
            echo "::error::Only the configured human dispatcher may request a review-round exception."
            exit 1
          fi

          printf '%s' "$EXCEPTION_INPUT" | jq -e '
            type == "object" and
            (keys | sort) == ["head_sha", "issue_id", "max_round", "merge_base_sha", "pr_number", "schema_version"]
          ' >/dev/null
          schema_version="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.schema_version | select(. == "loop-engineer-review-round-exception/v1")')"
          issue_id="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.issue_id | select(type == "string" and test("^ISSUE-[0-9]{3}$"))')"
          pr_number="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.pr_number | select(type == "number" and . > 0 and floor == .)')"
          declared_base_sha="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.merge_base_sha | select(type == "string" and test("^[0-9a-f]{40}$"))')"
          declared_head_sha="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))')"
          max_round="$(printf '%s' "$EXCEPTION_INPUT" | jq -er '.max_round | select(. == 4 or . == 5)')"
          test "$schema_version" = "loop-engineer-review-round-exception/v1"

          live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '{state,draft,base_ref:.base.ref,head_sha:.head.sha,mergeable}')"
          live_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$(jq -r '.state' <<<"$live_pr")" != "open" || "$(jq -r '.draft' <<<"$live_pr")" != "false" || "$(jq -r '.base_ref' <<<"$live_pr")" != "main" || "$(jq -r '.mergeable' <<<"$live_pr")" != "true" ]]; then
            echo "::error::The target must be an open, mergeable, non-draft PR to main."
            exit 1
          fi
          if [[ "$declared_base_sha" != "$live_base_sha" || "$declared_head_sha" != "$(jq -r '.head_sha' <<<"$live_pr")" ]]; then
            echo "::error::The exception request is stale for the current PR head or main SHA."
            exit 1
          fi

          echo "issue_id=$issue_id" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$live_base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$declared_head_sha" >> "$GITHUB_OUTPUT"
          echo "max_round=$max_round" >> "$GITHUB_OUTPUT"

  approve_and_publish:
    needs: prepare
    environment: hana-merge-human-approval
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: trusted-control
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
          package_json_file: trusted-control/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trusted-control/pnpm-lock.yaml
      - run: pnpm --dir trusted-control install --frozen-lockfile
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.LOOP_ENGINEER_APP_ID }}
          private-key: ${{ secrets.LOOP_ENGINEER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Publish the protected review-round exception proof
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LOOP_ENGINEER_APP_ID: ${{ vars.LOOP_ENGINEER_APP_ID }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          ISSUE_ID: ${{ needs.prepare.outputs.issue_id }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          MAX_ROUND: ${{ needs.prepare.outputs.max_round }}
        run: pnpm --dir trusted-control exec tsx scripts/loop-engineer/github-review-round-exception.ts approve
