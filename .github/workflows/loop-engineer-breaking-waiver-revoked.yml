name: loop-engineer-breaking-waiver-revoked

run-name: loop-engineer-breaking-waiver-revoked-${{ github.run_id }}

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: loop-engineer-breaking-waiver-revoked-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalidate_breaking_waiver:
    if: ${{ github.event.label.name == 'openapi-breaking-approved' }}
    environment: hana-merge-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.LOOP_ENGINEER_APP_ID }}
          private-key: ${{ secrets.LOOP_ENGINEER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Revoke checks bound to the removed waiver
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The event head SHA is invalid."
            exit 1
          fi
          live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '{state,base_ref:.base.ref,head_sha:.head.sha,approval_label_present:(.labels | map(.name) | index("openapi-breaking-approved") != null)}')"
          if [[ "$(jq -r '.state' <<<"$live_pr")" != "open" || "$(jq -r '.base_ref' <<<"$live_pr")" != "main" || "$(jq -r '.head_sha' <<<"$live_pr")" != "$EVENT_HEAD_SHA" ]]; then
            exit 0
          fi
          if [[ "$(jq -r '.approval_label_present' <<<"$live_pr")" == "true" ]]; then
            exit 0
          fi
          revoke_check() {
            local name="$1"
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$name" -f head_sha="$EVENT_HEAD_SHA" -f external_id="loop-engineer-waiver-revoked-${GITHUB_RUN_ID}-${name}" \
              -f status=completed -f conclusion=failure -f 'output[title]'="$name" -f 'output[summary]'=breaking_waiver_revoked
          }

          revoke_check merge-eligibility
          revoke_check validate
