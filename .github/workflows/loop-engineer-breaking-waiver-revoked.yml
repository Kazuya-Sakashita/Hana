name: loop-engineer-breaking-waiver-revoked

run-name: loop-engineer-breaking-waiver-revoked-${{ github.run_id }}

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: loop-engineer-breaking-waiver-revoked-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalidate_breaking_waiver:
    if: ${{ github.event.label.name == 'openapi-breaking-approved' }}
    environment: hana-merge-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-control
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trusted-control/pnpm-lock.yaml
      - run: pnpm --dir trusted-control install --frozen-lockfile
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.LOOP_ENGINEER_APP_ID }}
          private-key: ${{ secrets.LOOP_ENGINEER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Revoke checks bound to the removed waiver
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir trusted-control exec tsx scripts/loop-engineer/github-check-generation.ts revoke-waiver
